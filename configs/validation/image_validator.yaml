# Image validation thresholds. HARD = reject (the model output would be meaningless);
# WARN = accept but report. These are plausibility heuristics: passing them does NOT
# prove an image is a chest radiograph.
allowed_formats: [JPEG, PNG, BMP, TIFF]
hard:
  min_side_px: 64                 # smaller cannot carry diagnostic detail at 224 input
  max_side_px: 20000
  aspect_ratio_min: 0.25
  aspect_ratio_max: 4.0
  min_pixel_std: 2.0              # (0-255 scale) essentially constant image
  saturated_fraction: 0.90        # >= 90% pixels near-white (>=250) or near-black (<=5): blank
  colorfulness: 40.0              # Hasler-Suesstrunk metric; strongly coloured -> not a radiograph
warn:
  tiny_side_px: 256
  aspect_ratio_min: 0.5
  aspect_ratio_max: 2.0
  dark_mean: 30.0                 # mean intensity (0-255)
  bright_mean: 225.0
  colorfulness: 10.0              # mildly coloured (annotations, colour-tinted export)
  dominant_value_fraction: 0.40   # one exact grey level covers >= 40% of pixels (screenshot / synthetic)
