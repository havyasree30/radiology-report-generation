# DenseNet121 CheXpert baseline (Phase 2). Rationale: results/classification/densenet121_baseline/BASELINE_ANALYSIS.md
experiment_name: densenet121_baseline
output_dir: results/classification/densenet121_baseline
seed: 42
deterministic: true              # cudnn.deterministic; slower but reproducible

data:
  manifest: data/splits/chexpert/chexpert_image_manifest.csv.gz
  train_split: train
  val_split: val                 # model selection, early stopping, thresholds
  locked_splits: [test]          # never loaded by training / evaluation scripts
  view: Frontal                  # primary model: frontal AP/PA only
  exclusions: results/eda/tables/chexpert_exclusion_candidates.csv   # rows with recommendation == exclude
  num_workers: 6

label_policy:
  uncertain: ignore              # u_ignore | u_zero | u_one  (masked -> zero loss, zero gradient)
  blank: zero                    # zero | ignore              (NaN / unmentioned)

preprocessing:
  image_size: 224
  resize: aspect_preserving_longest_side   # longest side -> 224, then pad
  interpolation: bilinear        # PIL bilinear (antialiased when downsampling)
  pad_value: 0                   # black, pixel space [0, 255], applied before normalisation
  pad_position: center
  channels: 3                    # grayscale replicated to 3 channels for ImageNet weights
  mean: [0.485, 0.456, 0.406]    # ImageNet
  std: [0.229, 0.224, 0.225]

augmentation:                    # TRAIN only; val/test preprocessing is deterministic
  rotation_degrees: 5
  translate_fraction: 0.05
  scale_range: [0.95, 1.05]
  horizontal_flip: false         # laterality matters (e.g. dextrocardia, device side)
  vertical_flip: false
  color_jitter: false
  clahe: false

model:
  architecture: densenet121
  pretrained: IMAGENET1K_V1
  num_labels: 14                 # Linear(1024, 14) -> logits; NO sigmoid/softmax in forward

loss:
  type: weighted_bce             # bce | weighted_bce | focal | asl
  pos_weight_source: train_split # recomputed from the TRAINING partition at run time
  pos_weight_tempering: sqrt     # none | sqrt   (raw max 74.8 -> sqrt max ~8.6; see analysis)

optimizer:
  name: adamw
  lr: 1.0e-4
  weight_decay: 1.0e-4
  betas: [0.9, 0.999]

scheduler:
  name: reduce_on_plateau
  monitor: val_macro_auroc
  mode: max
  factor: 0.1
  patience: 1

training:
  max_epochs: 8
  batch_size: 32                 # physical
  grad_accumulation: 1           # effective batch = batch_size * grad_accumulation
  amp: true
  early_stopping_patience: 3     # epochs without val_macro_auroc improvement
  monitor: val_macro_auroc

inference:
  # Canonical numerical policy for ALL inference (validation probabilities, metrics, thresholds,
  # single-image inference, structured findings, locked-test evaluation). See
  # src/classification/inference_policy.py. Added at C1 finalization; C1 was trained before it existed.
  policy: fp32_strict

thresholds:
  method: youden_j
  source_split: val
  # canonical thresholds live at <output_dir>/evaluation/<inference.policy>/thresholds/youden_j_thresholds.json

findings:
  borderline_margin: 0.05        # |p - threshold| <= margin -> borderline (probability units)
