# C2 loss study arm 'c2d_asl'. GENERATED by scripts/make_c2_configs.py - do not edit by hand.
# Identical to the other C2 arms except `loss`, `experiment_name` and `output_dir`.
experiment_name: c2d_asl
output_dir: results/classification/experiments/c2d_asl
seed: 42
deterministic: true
data:
  manifest: data/splits/chexpert/chexpert_image_manifest.csv.gz
  train_split: train
  val_split: val
  locked_splits:
  - test
  view: Frontal
  exclusions: results/eda/tables/chexpert_exclusion_candidates.csv
  num_workers: 6
label_policy:
  uncertain: ignore
  blank: zero
preprocessing:
  image_size: 224
  resize: aspect_preserving_longest_side
  interpolation: bilinear
  pad_value: 0
  pad_position: center
  channels: 3
  mean:
  - 0.485
  - 0.456
  - 0.406
  std:
  - 0.229
  - 0.224
  - 0.225
augmentation:
  rotation_degrees: 5
  translate_fraction: 0.05
  scale_range:
  - 0.95
  - 1.05
  horizontal_flip: false
  vertical_flip: false
  color_jitter: false
  clahe: false
model:
  architecture: densenet121
  pretrained: IMAGENET1K_V1
  num_labels: 14
loss:
  type: asl
  gamma_pos: 0.0
  gamma_neg: 4.0
  clip: 0.05
optimizer:
  name: adamw
  lr: 0.0001
  weight_decay: 0.0001
  betas:
  - 0.9
  - 0.999
scheduler:
  name: reduce_on_plateau
  monitor: val_macro_auprc
  mode: max
  factor: 0.1
  patience: 1
training:
  max_epochs: 8
  batch_size: 32
  grad_accumulation: 1
  amp: true
  early_stopping_patience: 3
  monitor: val_macro_auprc
inference:
  policy: fp32_strict
thresholds:
  method: youden_j
  source_split: val
findings:
  borderline_margin: 0.05
